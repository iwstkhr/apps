name: Tsudou test

# 型チェックとユニットテスト (Vitest) を全パッケージで回す。Lint とフォーマットはリポジトリ直下の pre-commit.yml が見る。
# apps/tsudou/docs/openapi.yaml の作り直し忘れも backend のテスト (openapi.test.ts) で検出される。
on:
  pull_request:
    paths:
      - 'apps/tsudou/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/tsudou-test.yml'
  push:
    branches: [main]
    paths:
      - 'apps/tsudou/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/tsudou-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/tsudou

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # backend は wrangler types で Worker の型 (worker-configuration.d.ts) を生成してから検査する
      - name: Typecheck
        run: pnpm run typecheck

      # D1 のテストは wrangler の getPlatformProxy がローカルの D1 を立てるので、Cloudflare のアカウントは要らない
      - name: Test
        run: pnpm test
