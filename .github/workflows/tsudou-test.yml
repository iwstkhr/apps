name: "[tsudou] Test"

# 型チェックとユニットテスト (Vitest) を全パッケージで回す。Lint とフォーマットはリポジトリ直下の pre-commit.yml が見る。
# apps/tsudou/docs/openapi.yaml の作り直し忘れも backend のテスト (openapi.test.ts) で検出される。
on:
  pull_request:
    paths:
      - 'apps/tsudou/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/workflows/tsudou-test.yml'
  push:
    branches: [main]
    paths:
      - 'apps/tsudou/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/workflows/tsudou-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/tsudou

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # backend は wrangler types で Worker の型 (worker-configuration.d.ts) を生成してから検査する
      - name: Typecheck
        run: pnpm run typecheck

      # D1 のテストは wrangler の getPlatformProxy がローカルの D1 を立てるので、Cloudflare のアカウントは要らない
      - name: Test
        run: pnpm test
