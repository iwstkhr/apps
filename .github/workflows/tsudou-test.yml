name: "tsudou - Test"

# 型チェックとユニットテスト (Vitest) を全パッケージで回し、e2e テスト (Playwright) も回す。
# Lint とフォーマットはリポジトリ直下の pre-commit.yml が見る。
# apps/tsudou/docs/openapi.yaml の作り直し忘れも backend のテスト (openapi.test.ts) で検出される。
on:
  pull_request:
    paths:
      - 'apps/tsudou/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/workflows/tsudou-test.yml'
  push:
    branches: [main]
    paths:
      - 'apps/tsudou/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/workflows/tsudou-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/tsudou

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      # ジョブの if ではシークレットを読めないので、Slack の設定があるかだけを渡す
      slack-enabled: ${{ secrets.SLACK_BOT_TOKEN != '' && secrets.SLACK_CHANNEL_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # backend は wrangler types で Worker の型 (worker-configuration.d.ts) を生成してから検査する
      - name: Typecheck
        run: pnpm run typecheck

      # D1 のテストは wrangler の getPlatformProxy がローカルの D1 を立てるので、Cloudflare のアカウントは要らない
      - name: Test
        run: pnpm test

  # フロントエンドをビルドし、wrangler dev (ローカルの D1) で UI と API を配信して画面を操作する。
  # ブラウザはランナーにインストール済みの Google Chrome を使う
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: E2E test
        run: pnpm run test:e2e

      # 失敗の原因を追えるよう、レポート (トレース付き) を残す
      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/tsudou/e2e/playwright-report/
          retention-days: 7

  # 失敗したときだけ Slack に流す。フォークからの PR ではシークレットが読めないので飛ばす
  notify:
    name: Notify
    needs: [test, e2e]
    if: ${{ failure() && needs.test.outputs.slack-enabled == 'true' }}
    uses: iwstkhr/shared-config/.github/workflows/slack-notify.yml@main
    with:
      status: failure
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
