name: "[shelter-map] Test"

# 型チェックとユニットテスト (Vitest) を回す。Lint とフォーマット (Biome) はリポジトリ直下の pre-commit.yml が見る。
on:
  pull_request:
    paths:
      - 'apps/shelter-map/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/workflows/shelter-map-test.yml'
  push:
    branches: [main]
    paths:
      - 'apps/shelter-map/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/workflows/shelter-map-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/shelter-map

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      # ジョブの if ではシークレットを読めないので、Slack の設定があるかだけを渡す
      slack-enabled: ${{ secrets.SLACK_BOT_TOKEN != '' && secrets.SLACK_CHANNEL_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  # 失敗したときだけ Slack に流す。フォークからの PR ではシークレットが読めないので飛ばす
  notify:
    name: Notify
    needs: test
    if: ${{ failure() && needs.test.outputs.slack-enabled == 'true' }}
    uses: iwstkhr/shared-config/.github/workflows/slack-notify.yml@main
    with:
      status: ${{ needs.test.result }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
