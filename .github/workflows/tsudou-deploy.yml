name: "[tsudou] Deploy"

# 画面（静的アセット）と API（Express + D1）を 1 つの Cloudflare Worker として公開する。
on:
  push:
    branches: [main]
    paths:
      - 'apps/tsudou/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/tsudou-deploy.yml'
  # 手動でデプロイし直すときに使う
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsudou-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/tsudou

jobs:
  deploy:
    runs-on: ubuntu-latest
    # シークレットは依存パッケージのスクリプトから読まれないよう、Cloudflare を操作するステップにだけ渡す
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Worker が静的アセットとして配信する apps/tsudou/frontend/dist/ を作る
      - name: Build frontend
        run: pnpm run build

      # 初回だけデータベースを作る。wrangler deploy の自動作成はリージョンを指定できず、
      # マイグレーションより後に走るので使わない。apps/tsudou/backend/wrangler.jsonc は名前で引くので ID の書き戻しは要らない
      - name: Create D1 database if missing
        working-directory: apps/tsudou/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 info tsudou > /dev/null ||
            pnpm exec wrangler d1 create tsudou --location apac --no-update-config

      # 新しいコードが新しいスキーマを前提にできるよう、Worker より先に流す（適用済みのものは飛ばされる）
      - name: Apply D1 migrations
        working-directory: apps/tsudou/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply tsudou --remote

      # 設定は apps/tsudou/backend/wrangler.jsonc。SPA のフォールバックとレスポンスヘッダ（apps/tsudou/frontend/public/_headers）もここで効く
      - name: Deploy
        working-directory: apps/tsudou/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy
