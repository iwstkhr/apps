name: "tsudou - Deploy"

# Publish the UI (static assets) and the API (Express + D1) as a single Cloudflare Worker.
on:
  push:
    branches: [main]
    paths:
      - 'apps/tsudou/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/tsudou-deploy.yml'
  # Used to redeploy manually
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsudou-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/tsudou

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pass secrets only to the steps that call Cloudflare so that dependency scripts cannot read them
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Build apps/tsudou/frontend/dist/, which the Worker serves as static assets
      - name: Build frontend
        run: pnpm run build

      # Create the database only on the first run. wrangler deploy's auto-provisioning cannot choose a region
      # and runs after migrations, so it is not used. apps/tsudou/backend/wrangler.jsonc looks the database up by name, so the ID need not be written back
      - name: Create D1 database if missing
        working-directory: apps/tsudou/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 info tsudou > /dev/null ||
            pnpm exec wrangler d1 create tsudou --location apac --no-update-config

      # Apply migrations before the Worker so that new code can rely on the new schema (already applied ones are skipped)
      - name: Apply D1 migrations
        working-directory: apps/tsudou/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler d1 migrations apply tsudou --remote

      # Configured in apps/tsudou/backend/wrangler.jsonc. The SPA fallback and response headers (apps/tsudou/frontend/public/_headers) also take effect here
      - name: Deploy
        working-directory: apps/tsudou/backend
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy

  # Report both success and failure to Slack. Only push and manual runs trigger this, so secrets are always readable
  notify:
    name: Notify
    needs: deploy
    if: ${{ always() }}
    uses: iwstkhr/shared-config/.github/workflows/slack-notify.yml@main
    with:
      status: ${{ needs.deploy.result }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
