name: "tsudou - Preview Cleanup"

# Cron Triggers do not run in Previews, so delete expired data from the shared Preview D1 (tsudou-preview) here.
# Uses the same conditions as the production Cron Trigger (scheduled → deleteExpired in apps/tsudou/backend/src/worker.ts).
# Responses are deleted together with their events through the foreign key's ON DELETE CASCADE.
on:
  schedule:
    # Daily at 18:00 UTC (03:00 JST), the same as the production Cron Trigger
    - cron: '0 18 * * *'
  # Used to rerun the cleanup manually
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/tsudou/backend

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Pass secrets only to the steps that call Cloudflare so that dependency scripts cannot read them
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # wrangler d1 does not read the previews block, so use a config file that defines only the Preview database
      - name: Delete expired events
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm exec wrangler d1 execute tsudou-preview --remote --config wrangler.preview-migrations.jsonc \
            --command 'DELETE FROM events WHERE expires_at <= unixepoch()'

  # Report to Slack only on failure
  notify:
    name: Notify
    needs: cleanup
    if: ${{ failure() }}
    uses: iwstkhr/shared-config/.github/workflows/slack-notify.yml@main
    with:
      status: failure
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
