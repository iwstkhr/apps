name: "todo - Preview"

# Create a Cloudflare Workers Preview (wrangler preview) for each PR and comment its URL on the PR.
# The Preview is deleted when the PR is closed. Configured by preview_urls and previews in apps/todo/wrangler.jsonc.
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'apps/todo/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/workflows/todo-preview.yml'

permissions:
  contents: read

# Cancel older Preview builds for the same PR, but never cancel the deletion on close
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: ${{ github.event.action != 'closed' }}

defaults:
  run:
    working-directory: apps/todo

env:
  PREVIEW_NAME: pr-${{ github.event.pull_request.number }}

jobs:
  preview:
    # Skip PRs from forks because they cannot read secrets
    if: ${{ github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    # Pass secrets only to the steps that call Cloudflare so that dependency scripts cannot read them
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Do not use the dashboard's Preview base config; configure everything in wrangler.jsonc
      - name: Create or update Preview
        id: preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          output="$(pnpm exec wrangler preview --name "$PREVIEW_NAME" --ignore-base-config --json)"
          printf '%s\n' "$output"
          # Even with --json, wrangler writes asset upload progress to stdout before the JSON
          preview_url="$(printf '%s\n' "$output" | sed -n '/^{/,$p' | jq -ser '.[0].preview.urls[0]')"
          echo "url=$preview_url" >> "$GITHUB_OUTPUT"

      # Keep a single comment and rewrite it on every push
      - name: Comment Preview URL
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- todo-preview -->'
          body="$(printf '%s\n### todo Preview\n\n%s\n\nCommit: %s\n' "$marker" "$PREVIEW_URL" "$HEAD_SHA")"
          comment_id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)"
          if [ -n "$comment_id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" -f body="$body" > /dev/null
          else
            gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$body"
          fi

  cleanup:
    if: ${{ github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca  # v5
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Delete Preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler preview delete --name "$PREVIEW_NAME" --skip-confirmation

  # Report to Slack only on failure. PRs from forks skip the whole job above, so they are not reported either
  notify:
    name: Notify
    needs: [preview, cleanup]
    if: ${{ failure() }}
    uses: iwstkhr/shared-config/.github/workflows/slack-notify.yml@main
    with:
      status: failure
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
