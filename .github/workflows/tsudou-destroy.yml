name: Tsudou destroy

# Cloudflare 上のリソース（Worker と D1 のデータベース）を削除する。元に戻せないので手動実行のみ。
# Worker を先に消して配信と API を止めてから、指定されていればデータベースを消す。
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 削除を確定するには Worker 名（tsudou）を入力する
        required: true
        type: string
      delete_database:
        description: D1 のデータベース（イベントと回答のデータ）も削除する。元に戻せない
        required: true
        type: boolean
        default: false

permissions:
  contents: read

# デプロイと同時に走って、消した直後に作り直されないようにする
concurrency:
  group: tsudou-deploy
  cancel-in-progress: false

jobs:
  destroy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      # apps/tsudou/backend/wrangler.jsonc の name と d1_databases[].database_name
      WORKER_NAME: tsudou
      DATABASE_NAME: tsudou
    steps:
      # 入力はシェルに直接埋め込まず、環境変数で渡す
      - name: Check confirmation
        run: |
          test "$CONFIRM" = "$WORKER_NAME" || {
            echo "::error::confirm に Worker 名（$WORKER_NAME）が入力されていないため中止しました"
            exit 1
          }
        env:
          CONFIRM: ${{ inputs.confirm }}

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        working-directory: apps/tsudou
        run: pnpm install --frozen-lockfile

      # Cron Trigger と静的アセットも Worker と一緒に消える。
      # 他の Worker から参照されている場合は wrangler が失敗するので、--force は付けない
      - name: Delete Worker
        working-directory: apps/tsudou/backend
        run: pnpm exec wrangler delete "$WORKER_NAME"

      - name: Delete D1 database
        if: inputs.delete_database
        working-directory: apps/tsudou/backend
        run: pnpm exec wrangler d1 delete "$DATABASE_NAME" --skip-confirmation
