openapi: 3.1.0
info:
  title: Tsudou API
  version: 0.1.0
  description: API for an event scheduling service without sign-in. It is under
    /api on the UI origin and has no authentication. Character limits are
    applied after trimming whitespace.
components:
  schemas:
    CreateEventResult:
      type: object
      properties:
        eventId:
          type: string
        manageToken:
          type: string
          description: Management token; returned in plaintext only once
      required:
        - eventId
        - manageToken
    ErrorResponse:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              enum:
                - VALIDATION
                - FORBIDDEN
                - NOT_FOUND
                - CLOSED
                - DUPLICATE_NAME
                - RATE_LIMITED
                - INTERNAL
            message:
              type: string
              description: Message suitable for direct display in the UI
          required:
            - code
            - message
      required:
        - error
    CreateEventBody:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
          description: Event title
        fee:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1000000
          description: Fee in yen, as an integer
        memo:
          type:
            - string
            - "null"
          maxLength: 2000
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/CandidateInput"
          minItems: 1
          maxItems: 30
      required:
        - title
        - candidates
    CandidateInput:
      type: object
      properties:
        id:
          type:
            - string
            - "null"
          description: Existing candidate ID; a new ID is generated when omitted
        startAt:
          type: string
          format: date-time
          description: Start date/time (ISO 8601)
      required:
        - startAt
    EventView:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        fee:
          type:
            - integer
            - "null"
        memo:
          type:
            - string
            - "null"
        candidates:
          type: array
          items:
            $ref: "#/components/schemas/Candidate"
          description: Sorted by start date/time in ascending order
        closed:
          type: boolean
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: integer
          description: Automatic deletion time (epoch seconds)
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerView"
          description: Sorted by creation time in ascending order
      required:
        - id
        - title
        - fee
        - memo
        - candidates
        - closed
        - createdAt
        - expiresAt
        - answers
    Candidate:
      type: object
      properties:
        id:
          type: string
          description: Candidate ID
        startAt:
          type: string
          format: date-time
          description: Start date/time (ISO 8601)
      required:
        - id
        - startAt
    AnswerView:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        message:
          type:
            - string
            - "null"
        choices:
          type: array
          items:
            $ref: "#/components/schemas/Choice"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - message
        - choices
        - createdAt
        - updatedAt
    Choice:
      type: object
      properties:
        candidateId:
          type: string
        status:
          $ref: "#/components/schemas/AnswerStatus"
      required:
        - candidateId
        - status
    AnswerStatus:
      type: string
      enum:
        - YES
        - NO
        - MAYBE
      description: "YES: attending / NO: not attending / MAYBE: undecided"
    UpdateEventBody:
      type: object
      properties:
        title:
          type:
            - string
            - "null"
          maxLength: 100
          description: Event title
        fee:
          type:
            - number
            - "null"
          minimum: 0
          maximum: 1000000
          description: Fee in yen, as an integer
        memo:
          type:
            - string
            - "null"
          maxLength: 2000
        candidates:
          type:
            - array
            - "null"
          items:
            $ref: "#/components/schemas/CandidateInput"
          minItems: 1
          maxItems: 30
        closed:
          type:
            - boolean
            - "null"
    SubmitAnswerResult:
      type: object
      properties:
        answer:
          $ref: "#/components/schemas/AnswerView"
        editToken:
          type: string
          description: Response edit key; returned in plaintext only once
      required:
        - answer
        - editToken
    AnswerBody:
      type: object
      properties:
        name:
          type: string
          maxLength: 40
          description: Respondent name
        message:
          type:
            - string
            - "null"
          maxLength: 500
        choices:
          type: array
          items:
            $ref: "#/components/schemas/Choice"
          description: Exactly one choice per candidate, with no missing or extra entries
      required:
        - name
        - choices
  parameters: {}
paths:
  /api/healthz:
    get:
      summary: Health check
      tags:
        - system
      responses:
        "200":
          description: Operational
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    enum:
                      - true
                required:
                  - ok
  /api/events:
