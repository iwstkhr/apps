name: "tsudou - Test"

# Run type checks and unit tests (Vitest) in every package, then e2e tests (Playwright).
# Lint and formatting are checked by pre-commit.yml at the repository root.
# The backend tests (openapi.test.ts) also catch a forgotten regeneration of apps/tsudou/docs/openapi.yaml.
on:
  pull_request:
    paths:
      - 'apps/tsudou/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/workflows/tsudou-test.yml'
  push:
    branches: [main]
    paths:
      - 'apps/tsudou/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/workflows/tsudou-test.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: apps/tsudou

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      # Job-level if conditions cannot read secrets, so pass only whether Slack is configured
      slack-enabled: ${{ secrets.SLACK_BOT_TOKEN != '' && secrets.SLACK_CHANNEL_ID != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The backend generates the Worker types (worker-configuration.d.ts) with wrangler types before type checking
      - name: Typecheck
        run: pnpm run typecheck

      # The D1 tests use a local D1 started by wrangler's getPlatformProxy, so no Cloudflare account is needed
      - name: Test
        run: pnpm test

  # Build the frontend, serve the UI and API with wrangler dev (local D1), and drive the UI.
  # Use the Google Chrome already installed on the runner
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: E2E test
        run: pnpm run test:e2e

      # Keep the report (with traces) so failures can be investigated
      - name: Upload report
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: apps/tsudou/e2e/playwright-report/
          retention-days: 7

  # Report to Slack only on failure. Skip PRs from forks because they cannot read secrets
  notify:
    name: Notify
    needs: [test, e2e]
    if: ${{ failure() && needs.test.outputs.slack-enabled == 'true' }}
    uses: iwstkhr/shared-config/.github/workflows/slack-notify.yml@main
    with:
      status: failure
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
