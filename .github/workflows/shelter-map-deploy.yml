name: "shelter-map - Deploy"

# Publish the static assets (build/client/) with Cloudflare Workers. Configured in apps/shelter-map/wrangler.jsonc.
on:
  push:
    branches: [main]
    paths:
      - 'apps/shelter-map/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/workflows/shelter-map-deploy.yml'
  # Used to redeploy manually
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shelter-map-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/shelter-map

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Pass secrets only to the steps that call Cloudflare so that dependency scripts cannot read them
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5  # v5
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workers serve from the domain root, so no BASE_PATH is set
      - name: Build
        run: pnpm run build

      - name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm run deploy

  # Report both success and failure to Slack. Only push and manual runs trigger this, so secrets are always readable
  notify:
    name: Notify
    needs: deploy
    if: ${{ always() }}
    uses: iwstkhr/shared-config/.github/workflows/slack-notify.yml@main
    with:
      status: ${{ needs.deploy.result }}
    secrets:
      SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
      SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
