<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="Schedule events with Tsudou without signing in." />
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <!-- ヘッダの背景色。ダークテーマでは下のスクリプトと src/lib/theme.ts が書き換える -->
    <meta name="theme-color" content="#ffffff" />
    <title>Tsudou | Event scheduling</title>
    <script>
      // 初回描画前にテーマを決めてチラつきを防ぐ。ロジックは src/lib/theme.ts と揃えること
      (() => {
        let language = 'en';
        const languages = navigator.languages?.length ? navigator.languages : [navigator.language];
        for (const locale of languages) {
          const candidate = locale?.split('-')[0]?.toLowerCase();
          if (candidate === 'ja' || candidate === 'en') {
            language = candidate;
            break;
          }
        }
        try {
          const saved = localStorage.getItem('tsudou:language');
          if (saved === 'ja' || saved === 'en') language = saved;
        } catch {}
        document.documentElement.lang = language;
        document.title = language === 'en' ? 'Tsudou | Event scheduling' : 'Tsudou｜イベント日程調整';
        let pref = null;
        try {
          pref = localStorage.getItem('tsudou:theme');
        } catch {}
        const dark =
          pref === 'dark' ||
          (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document
          .querySelector('meta[name="theme-color"]')
          .setAttribute('content', dark ? '#0f172b' : '#ffffff');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
