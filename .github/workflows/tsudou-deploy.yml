name: Tsudou deploy

# 画面（静的アセット）と API（Express + D1）を 1 つの Cloudflare Worker として公開する。
on:
  # TODO: 移行の準備が整うまで自動実行を止めている。再開するときは push トリガーを戻す
  # push:
  #   branches: [main]
  # 手動でデプロイし直すときに使う
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsudou-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          package_json_file: apps/tsudou/package.json

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: apps/tsudou/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: apps/tsudou
        run: pnpm install --frozen-lockfile

      # Worker が静的アセットとして配信する apps/tsudou/frontend/dist/ を作る
      - name: Build frontend
        working-directory: apps/tsudou
        run: pnpm run build

      # 初回だけデータベースを作る。wrangler deploy の自動作成はリージョンを指定できず、
      # マイグレーションより後に走るので使わない。apps/tsudou/backend/wrangler.jsonc は名前で引くので ID の書き戻しは要らない
      - name: Create D1 database if missing
        working-directory: apps/tsudou/backend
        run: |
          pnpm exec wrangler d1 info tsudou > /dev/null ||
            pnpm exec wrangler d1 create tsudou --location apac --no-update-config

      # 新しいコードが新しいスキーマを前提にできるよう、Worker より先に流す（適用済みのものは飛ばされる）
      - name: Apply D1 migrations
        working-directory: apps/tsudou/backend
        run: pnpm exec wrangler d1 migrations apply tsudou --remote

      # 設定は apps/tsudou/backend/wrangler.jsonc。SPA のフォールバックとレスポンスヘッダ（apps/tsudou/frontend/public/_headers）もここで効く
      - name: Deploy
        working-directory: apps/tsudou/backend
        run: pnpm exec wrangler deploy
