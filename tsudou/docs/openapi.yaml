          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: RATE_LIMITED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: INTERNAL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
