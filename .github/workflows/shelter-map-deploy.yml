name: "[shelter-map] Deploy"

# 静的アセット（build/client/）を Cloudflare Workers で公開する。設定は apps/shelter-map/wrangler.jsonc。
on:
  workflow_run:
    workflows:
      - "[shelter-map] Check"
    types:
      - completed
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: shelter-map-deploy
  cancel-in-progress: false

defaults:
  run:
    working-directory: apps/shelter-map

jobs:
  deploy:
    name: Deploy
    # Check が失敗したコミットは公開しない
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          # Check が検査したコミットをそのまま公開する
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Workers ではドメインのルートで配信するので BASE_PATH は付けない
      - name: Build
        run: pnpm run build

      - name: Deploy
        run: pnpm run deploy
