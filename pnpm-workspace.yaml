packages:
  - apps/*
  - apps/tsudou/*

saveExact: true

# Install scripts of dependencies are blocked by default,
# so allow only the ones that are needed explicitly.
allowBuilds:
  '@parcel/watcher': true
  core-js: false
  esbuild: true
  workerd: true

# Supply chain attack protection
# Do not install versions published less than 7 days (10080 minutes) ago
minimumReleaseAge: 10080
# Reject versions whose trust level (provenance, etc.) is lower than earlier versions
trustPolicy: no-downgrade
# Excluded because the maintainer published this legitimate release manually without CI
trustPolicyExclude:
  - semver@6.3.1
# Block transitive dependencies from being fetched from Git repositories or tarball URLs
blockExoticSubdeps: true
