name: "[shelter-map] Check"

on:
  pull_request:
    paths:
      - 'apps/shelter-map/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/workflows/shelter-map-check.yml'
  push:
    branches:
      - main
    paths:
      - 'apps/shelter-map/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'mise.toml'
      - '.github/workflows/shelter-map-check.yml'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/shelter-map

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c  # v4
        with:
          cache: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint of the whole repository (pre-commit hooks) runs in pre-commit.yml

      - name: Run check
        run: pnpm run check

      - name: Run typecheck
        run: pnpm run typecheck

      - name: Run tests
        run: pnpm run test
