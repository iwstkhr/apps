packages:
  - apps/*
  - apps/tsudou/*

saveExact: true

# Install scripts of dependencies are blocked by default,
# so allow only the ones that are needed explicitly.
allowBuilds:
  '@parcel/watcher': true
  core-js: false
  esbuild: true
  workerd: true

# Supply chain attack protection
# Do not install versions published less than 7 days (10080 minutes) ago
minimumReleaseAge: 10080
# Allowed before the 7-day wait because it fixes CVE-2026-111181 (HIGH) in body-parser 2.3.0
minimumReleaseAgeExclude:
  - body-parser@2.4.0
# Reject versions whose trust level (provenance, etc.) is lower than earlier versions
trustPolicy: no-downgrade
# Excluded because the maintainers published these legitimate releases manually without CI
trustPolicyExclude:
  - semver@6.3.1
  # Required by workbox-build; its code is identical to the attested 2.5.0
  - '@trickfilm400/rollup-plugin-off-main-thread@3.0.0-pre1'
# Block transitive dependencies from being fetched from Git repositories or tarball URLs
blockExoticSubdeps: true
