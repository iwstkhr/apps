repos:
  # General file fixers and syntax checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Change to [--unsafe] for YAML with custom tags, such as CloudFormation
      - id: check-yaml
        args: [--allow-multiple-documents]
      # Prefer single quotes for Python string literals
      - id: double-quote-string-fixer
      - id: end-of-file-fixer
        exclude: \.svg$
      - id: trailing-whitespace

  # Lint GitHub Actions workflows
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  # Detect secrets such as API keys and tokens
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # Lint Markdown
  - repo: https://github.com/markdownlint/markdownlint
    rev: v0.18.1
    hooks:
      - id: markdownlint
        # YAML frontmatter-only content files trip MD032 on list syntax
        exclude: ^src/content/

  # Lint shell scripts
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck

  - repo: https://github.com/biomejs/pre-commit
    rev: v2.5.13 # Use the sha / tag you want to point at
    hooks:
      - id: biome-check
